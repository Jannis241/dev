# Manual theme overview. Program themes are independent.
# Neovim reads this file and updates only nvim_theme when <C-t> or :Theme is used.
#
# Program-specific files stay manual:
# ghostty: ~/.config/ghostty/config
# rofi:    ~/.config/colors/colors.rasi
# waybar:  ~/.config/colors/colors.css
# wlogout: ~/.config/wlogout/colors.css

nvim_theme = ayu
ghostty_theme = ayu
rofi_theme = ayu
waybar_theme = ayu
wlogout_theme = ayu
