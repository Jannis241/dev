# Change this file when using these dotfiles on another machine.
# Everything else in ~/.config/hypr should work without host-specific edits.

# Programs you may want to change.
$terminal = ghostty
$fileManager = thunar
$menu = rofi -show drun -show-icons -p "Run> "
# $menu = tofi

# Monitor layout for this machine.
# Run `hyprctl monitors` to find monitor names on a new machine.
monitor = DP-1, 1920x1080@165, 1920x0, 1
monitor = DP-2, 1920x1080@165, 0x0, 1

# Workspace mapping for this machine.
workspace = 1, monitor:DP-1
workspace = 2, monitor:DP-1
workspace = 3, monitor:DP-1
workspace = 4, monitor:DP-1
workspace = 5, monitor:DP-1
workspace = 6, monitor:DP-2
workspace = 7, monitor:DP-2
workspace = 8, monitor:DP-2
workspace = 9, monitor:DP-2
workspace = 10, monitor:DP-2

# Keyboard layout and host-specific input tweaks.
input {
    kb_layout = de
    kb_variant =
    kb_model =
    kb_options = caps:escape
    kb_rules =
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}
