# Example local Hyprland overrides.
# Copy snippets from here into ~/.config/hypr-host.conf.
# dev-env never overwrites ~/.config/hypr-host.conf.

# Monitors:
# monitor = DP-1, 1920x1080@165, 0x0, 1
# monitor = DP-2, 1920x1080@165, 1920x0, 1
# monitor = eDP-1, disable

# Workspaces:
# workspace = 1, monitor:DP-1
# workspace = 2, monitor:DP-1
# workspace = 6, monitor:DP-2

# Host-specific autostart:
# exec-once = blueman-applet

# Per-host input tweaks:
# input {
#     kb_layout = de
#     kb_options = caps:escape
# }
